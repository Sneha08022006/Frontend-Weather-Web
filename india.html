<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Weather & Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; color: white; }
        
        body {
            background-color: #d1c6b8;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), /* Dark overlay for white text readability */
                url('https://images.unsplash.com/photo-1509316785289-025f5b846b35?q=80&w=2000&auto=format&fit=crop'); /* Beautiful minimalist desert sand dunes */
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
        }
        
        .app-wrapper {
            width: 100%;
            max-width: 1024px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        
        /* Header */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 30px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10;
        }
        .header-left, .header-right { display: flex; align-items: center; gap: 20px; }
        .icon-btn { font-size: 24px; color: white; cursor: pointer; text-decoration: none; transition: 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .icon-btn:hover { transform: scale(1.1); color: #b3d4ff; }
        .title { font-size: 24px; font-weight: 400; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* Dashboard Layout */
        .dashboard { 
            display: flex; flex: 1; overflow: hidden; 
            flex-direction: row; 
        }

        /* Sidebar - Cities List */
        .sidebar { 
            width: 350px; 
            background: rgba(0, 0, 0, 0.1); 
            backdrop-filter: blur(10px);
            overflow-y: auto; 
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            border-right: 1px solid rgba(255,255,255,0.05);
            scrollbar-width: none;
        }
        .sidebar::-webkit-scrollbar { display: none; }

        .city-card { 
            background: rgba(255,255,255,0.05); 
            backdrop-filter: blur(10px);
            border-radius: 15px; padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s; cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
        }
        .city-card:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .city-info { display: flex; flex-direction: column; gap: 5px; }
        .city-name { font-size: 18px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .city-desc { font-size: 13px; color: #cbd5e1; text-transform: capitalize; }
        .city-temp-block { display: flex; align-items: center; gap: 15px; }
        .city-temp { font-size: 28px; font-weight: 300; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .city-icon { font-size: 30px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }

        /* Main Area - Map */
        .map-area { flex: 1; position: relative; padding: 20px; }
        .map-container { width: 100%; height: 100%; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }
        #map { width: 100%; height: 100%; background: transparent; }

        /* Custom Markers */
        .custom-marker { 
            background: rgba(10, 30, 50, 0.85); color: white; border-radius: 20px; 
            padding: 6px 12px; display: flex; justify-content: center; align-items: center; 
            font-weight: 600; font-size: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px);
            white-space: nowrap; gap: 8px;
        }
        .marker-icon { font-size: 18px; }

        /* Settings Modal */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 1000; 
            opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal { 
            background: rgba(15, 30, 50, 0.9); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            transform: translateY(20px); transition: transform 0.3s;
        }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-title { font-size: 20px; font-weight: 600; }
        .close-btn { font-size: 24px; cursor: pointer; color: #94a3b8; transition: 0.2s; }
        .close-btn:hover { color: white; }
        
        .setting-group { margin-bottom: 20px; }
        .setting-label { display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 8px; }
        .setting-control select { 
            width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4); color: white; font-size: 15px; outline: none; backdrop-filter: blur(5px);
        }
        .setting-control select option { background: #1e293b; color: white; }
        .setting-control select:focus { border-color: #8bb4e5; }

        /* Responsive Design */
        @media (max-width: 768px) {
            .dashboard { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); height: 40vh; flex-shrink: 0; }
            .map-area { height: 60vh; flex-shrink: 0; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header>
            <div class="header-left">
                <a href="index.html" class="icon-btn" title="Back to Home"><i class="fas fa-arrow-left"></i></a>
                <div class="title">India Live Weather</div>
            </div>
            <div class="header-right">
                <div class="icon-btn" onclick="toggleSettings()" title="Settings"><i class="fas fa-cog"></i></div>
            </div>
        </header>

        <div class="dashboard">
            <div class="sidebar" id="citiesList">
                <div style="text-align:center; color:#94a3b8; margin-top:20px;"><i class="fas fa-spinner fa-spin"></i> Fetching Live Data...</div>
            </div>
            
            <div class="map-area">
                <div class="map-container">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal" onclick="closeModalOnOutsideClick(event)">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Preferences</div>
                <div class="close-btn" onclick="toggleSettings()"><i class="fas fa-times"></i></div>
            </div>
            <div class="setting-group">
                <label class="setting-label">Temperature Unit</label>
                <div class="setting-control">
                    <select id="unitSelect" onchange="updateUnits()">
                        <option value="C">Celsius (°C)</option>
                        <option value="F">Fahrenheit (°F)</option>
                    </select>
                </div>
            </div>
            <div class="setting-group">
                <label class="setting-label">Map Style</label>
                <div class="setting-control">
                    <select id="mapStyle" onchange="changeMapStyle()">
                        <option value="dark">Dark Theme (Default)</option>
                        <option value="light">Light Theme</option>
                        <option value="satellite">Satellite</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const indianCities = [
            { name: "Chandigarh", lat: 30.7333, lon: 76.7794 },
            { name: "Mohali", lat: 30.7046, lon: 76.7179 },
            { name: "New Delhi", lat: 28.6139, lon: 77.2090 },
            { name: "Mumbai", lat: 19.0760, lon: 72.8777 },
            { name: "Bengaluru", lat: 12.9716, lon: 77.5946 },
            { name: "Kolkata", lat: 22.5726, lon: 88.3639 },
            { name: "Chennai", lat: 13.0827, lon: 80.2707 },
            { name: "Hyderabad", lat: 17.3850, lon: 78.4867 },
            { name: "Ahmedabad", lat: 23.0225, lon: 72.5714 },
            { name: "Pune", lat: 18.5204, lon: 73.8567 },
            { name: "Jaipur", lat: 26.9124, lon: 75.7873 },
            { name: "Lucknow", lat: 26.8467, lon: 80.9462 },
            { name: "Kochi", lat: 9.9312, lon: 76.2673 },
            { name: "Srinagar", lat: 34.0837, lon: 74.7973 }
        ];

        let currentUnit = 'C';
        let weatherDataCache = {};
        let markers = [];

        // All icons updated to be clean white like the reference image
        function getWeatherDetails(code) {
            const map = {
                0: { desc: "Clear Sky", icon: "<i class='fas fa-sun'></i>" },
                1: { desc: "Mainly Clear", icon: "<i class='fas fa-cloud-sun'></i>" }, 
                2: { desc: "Partly Cloudy", icon: "<i class='fas fa-cloud-sun'></i>" }, 
                3: { desc: "Overcast", icon: "<i class='fas fa-cloud'></i>" },
                45: { desc: "Fog", icon: "<i class='fas fa-smog'></i>" }, 
                48: { desc: "Freezing Fog", icon: "<i class='fas fa-smog'></i>" },
                51: { desc: "Light Drizzle", icon: "<i class='fas fa-cloud-rain'></i>" }, 
                53: { desc: "Drizzle", icon: "<i class='fas fa-cloud-rain'></i>" }, 
                55: { desc: "Heavy Drizzle", icon: "<i class='fas fa-cloud-showers-heavy'></i>" },
                61: { desc: "Light Rain", icon: "<i class='fas fa-cloud-rain'></i>" }, 
                63: { desc: "Rain", icon: "<i class='fas fa-cloud-showers-heavy'></i>" }, 
                65: { desc: "Heavy Rain", icon: "<i class='fas fa-cloud-showers-heavy'></i>" },
                71: { desc: "Light Snow", icon: "<i class='fas fa-snowflake'></i>" }, 
                73: { desc: "Snow", icon: "<i class='fas fa-snowflake'></i>" }, 
                75: { desc: "Heavy Snow", icon: "<i class='fas fa-snowflake'></i>" },
                80: { desc: "Rain Showers", icon: "<i class='fas fa-cloud-rain'></i>" }, 
                81: { desc: "Heavy Showers", icon: "<i class='fas fa-cloud-showers-heavy'></i>" }, 
                82: { desc: "Violent Showers", icon: "<i class='fas fa-cloud-showers-heavy'></i>" },
                95: { desc: "Thunderstorm", icon: "<i class='fas fa-bolt'></i>" }, 
                96: { desc: "Thunderstorm & Hail", icon: "<i class='fas fa-bolt'></i>" }, 
                99: { desc: "Heavy Thunderstorm", icon: "<i class='fas fa-bolt'></i>" }
            };
            return map[code] || { desc: "Unknown", icon: "<i class='fas fa-cloud'></i>" };
        }

        const map = L.map('map', { zoomControl: false }).setView([22.5937, 78.9629], 5);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        
        let tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        function changeMapStyle() {
            const style = document.getElementById("mapStyle").value;
            map.removeLayer(tileLayer);
            if(style === 'light') {
                tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            } else if (style === 'satellite') {
                tileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
            } else {
                tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            }
        }

        function toggleSettings() {
            const modal = document.getElementById("settingsModal");
            modal.classList.toggle("active");
        }

        function closeModalOnOutsideClick(event) {
            if(event.target.id === 'settingsModal') toggleSettings();
        }

        function convertTemp(tempC) {
            if(currentUnit === 'F') return Math.round((tempC * 9/5) + 32);
            return Math.round(tempC);
        }

        function updateUnits() {
            currentUnit = document.getElementById("unitSelect").value;
            renderDashboard();
        }

        async function fetchAllWeather() {
            const lats = indianCities.map(c => c.lat).join(',');
            const lons = indianCities.map(c => c.lon).join(',');
            
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,weather_code`);
                const data = await res.json();
                
                const isArray = Array.isArray(data);
                
                indianCities.forEach((city, index) => {
                    const cityData = isArray ? data[index] : data;
                    weatherDataCache[city.name] = {
                        temp: cityData.current.temperature_2m,
                        code: cityData.current.weather_code
                    };
                });
                
                renderDashboard();
            } catch (e) {
                console.error("Failed to fetch weather data", e);
                document.getElementById("citiesList").innerHTML = `<div style="text-align:center; color:#ef4444; padding:20px;">Failed to load data. Please try again later.</div>`;
            }
        }

        function renderDashboard() {
            const list = document.getElementById("citiesList");
            list.innerHTML = "";
            
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            indianCities.forEach(city => {
                const data = weatherDataCache[city.name];
                if(!data) return;

                const tempDisplay = convertTemp(data.temp) + "°" + currentUnit;
                const details = getWeatherDetails(data.code);

                const card = document.createElement('div');
                card.className = "city-card";
                card.onclick = () => map.flyTo([city.lat, city.lon], 9, { duration: 1.5 });
                card.innerHTML = `
                    <div class="city-info">
                        <div class="city-name">${city.name}</div>
                        <div class="city-desc">${details.desc}</div>
                    </div>
                    <div class="city-temp-block">
                        <div class="city-icon">${details.icon}</div>
                        <div class="city-temp">${tempDisplay}</div>
                    </div>
                `;
                list.appendChild(card);

                const markerIcon = L.divIcon({
                    className: 'map-marker-wrapper',
                    html: `
                        <div class="custom-marker">
                            <span class="marker-icon">${details.icon}</span> 
                            <span>${tempDisplay}</span>
                        </div>
                    `,
                    iconSize: [80, 40],
                    iconAnchor: [40, 20]
                });
                
                const marker = L.marker([city.lat, city.lon], {icon: markerIcon}).addTo(map)
                    .bindPopup(`<b>${city.name}</b><br>${details.desc}<br>Temp: ${tempDisplay}`);
                markers.push(marker);
            });
        }

        fetchAllWeather();
    </script>
</body>
</html>
